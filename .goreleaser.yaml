version: 2

project_name: agent-observatory

before:
  hooks:
    - test -f internal/webui/dist/index.html

builds:
  - id: agent-observatory
    main: ./cmd/agent-observatory
    binary: agent-observatory
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/agent-observatory/agent-observatory-go/internal/config.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - agent-observatory
    name_template: "agent-observatory_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: agent-observatory
    repository:
      owner: xxddccaa
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: "{{ if not .Env.HOMEBREW_TAP_TOKEN }}true{{ else }}auto{{ end }}"
    directory: Formula
    homepage: "https://github.com/xxddccaa/agent-observatory-go"
    description: "Local-first, read-only multi-agent coding session observatory"
    license: "MIT"
    install: |
      bin.install "agent-observatory"
      bin.install_symlink "agent-observatory" => "aobs"
    test: |
      assert_match version.to_s, shell_output("#{bin}/agent-observatory --version")
      assert_match version.to_s, shell_output("#{bin}/aobs --version")
